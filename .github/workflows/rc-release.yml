name: Prerelease

on:
  push:
    tags:
      - "v*.*.*-rc*"
      - "v*.*.*-fc.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Prerelease tag to create or publish, e.g. v1.2.0-rc1 or v1.2.0-fc.1"
        required: true
        type: string
      target_ref:
        description: "Commit SHA, branch, or tag to build when creating the prerelease tag"
        required: true
        type: string

concurrency:
  group: prerelease-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  prerelease:
    name: Draft prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The prerelease is published in the repository whose tag triggered the
      # run (GitHub's own GITHUB_REPOSITORY); no repository setting names it.
      - name: Checkout dispatch target
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Checkout pushed tag
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Resolve prerelease tag
        id: prerelease
        env:
          DISPATCH_TAG: ${{ inputs.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(rc[0-9]+|fc\.[0-9]+)$ ]]; then
            echo "ERROR: prerelease tag must match vMAJOR.MINOR.PATCH-rcN or vMAJOR.MINOR.PATCH-fc.N, got: $tag" >&2
            exit 1
          fi

          commit="$(git rev-parse HEAD)"
          git fetch --force --tags origin

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "$tag")"
            if [ "$tagged_commit" != "$commit" ]; then
              echo "ERROR: tag $tag points at $tagged_commit, not checked-out commit $commit" >&2
              exit 1
            fi
            echo "Using existing tag $tag at $commit"
          else
            if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
              echo "ERROR: push event for $tag did not leave a local tag ref" >&2
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag" "$commit"
            git push origin "refs/tags/$tag"
            echo "Created tag $tag at $commit"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check go.mod replace directives
        # The replace policy has one owner, scripts/check-gomod-replace.sh (the
        # same required check CI runs). An inline "no replace at all" grep here
        # would contradict it for a replace the policy explicitly permits.
        run: make check-gomod-replace

      - name: Run GoReleaser draft prerelease
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7
        with:
          version: "~> v2"
          args: release --clean --draft --skip=announce
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.prerelease.outputs.tag }}

      - name: Summarize prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.prerelease.outputs.tag }}
          TARGET_COMMIT: ${{ steps.prerelease.outputs.commit }}
        run: |
          set -euo pipefail
          url="$(gh release view "$TAG_NAME" --json url --jq .url)"
          {
            echo "### Draft prerelease"
            echo
            echo "- Tag: \`$TAG_NAME\`"
            echo "- Commit: \`$TARGET_COMMIT\`"
            echo "- Release: $url"
            echo
            echo "This workflow creates a draft prerelease only. It does not update the Homebrew tap or mark the release latest."
          } >> "$GITHUB_STEP_SUMMARY"
